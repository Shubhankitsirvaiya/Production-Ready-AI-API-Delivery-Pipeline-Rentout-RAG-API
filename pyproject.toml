# Build system metadata tells pip how to package/install this project.
[build-system]
# setuptools is enough for this simple Python package.
requires = ["setuptools>=68"]
# Use setuptools' PEP 517 build backend.
build-backend = "setuptools.build_meta"

# Project metadata used when installing the package.
[project]
# Package name for this demo project.
name = "rentout-rag-chatbot"
# Static package version for local Python packaging.
version = "0.1.0"
# Short project description.
description = "Deployment-focused async RAG chatbot for RentOut furniture rental support."
# Supported Python version range.
requires-python = ">=3.10"
# Runtime dependencies for the package installation path.
dependencies = [
    # FastAPI web framework.
    "fastapi>=0.111.0",
    # Uvicorn ASGI server.
    "uvicorn[standard]>=0.30.0",
    # Local .env loader.
    "python-dotenv>=1.0.1",
    # Pydantic settings helper.
    "pydantic-settings>=2.3.0",
    # OpenAI SDK.
    "openai>=1.86.0",
    # DOCX parser/generator.
    "python-docx>=1.1.2",
    # Async HTTP client for smoke tests.
    "httpx>=0.27.0",
]

# Optional dependencies used by developers and CI tests.
[project.optional-dependencies]
# `pip install -e .[dev]` installs pytest tooling.
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

# setuptools package discovery settings.
[tool.setuptools.packages.find]
# Search for packages from the repository root.
where = ["."]
# Include the app package and subpackages.
include = ["app*"]

# pytest configuration lives here so local and CI test runs match.
[tool.pytest.ini_options]
# Allow pytest-asyncio to handle async tests automatically.
asyncio_mode = "auto"
# Add repository root to import path so `app` imports work.
pythonpath = ["."]