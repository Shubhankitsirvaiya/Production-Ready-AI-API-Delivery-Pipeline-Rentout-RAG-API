# ServiceAccount is part of the Kubernetes core API.
apiVersion: v1
# A ServiceAccount gives each RentOut Pod an explicit Kubernetes identity.
kind: ServiceAccount
metadata:
  # The Deployment references this exact name.
  name: rentout-api
  labels:
    app.kubernetes.io/name: rentout-api
# The API does not call Kubernetes, so it does not need a mounted API token.
automountServiceAccountToken: false
# Kubernetes uses this Docker-registry Secret when the GHCR package is private.
# For a public package, an unavailable pull secret only produces a warning and anonymous pull is attempted.
imagePullSecrets:
  - name: ghcr-pull-secret


