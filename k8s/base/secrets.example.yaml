# TEMPLATE ONLY: do not put real values in this tracked file.
# scripts/k8s/bootstrap-local.ps1 creates the real Secret from the local .env file.
apiVersion: v1
# Secret stores sensitive values separately from normal configuration.
kind: Secret
metadata:
  # The Deployment loads this Secret with envFrom.
  name: rentout-api-secrets
  labels:
    app.kubernetes.io/name: rentout-api
# Opaque is the general-purpose Secret type.
type: Opaque
# stringData accepts readable input; Kubernetes stores encoded values internally.
stringData:
  # Required for OpenAI embeddings and generated answers.
  OPENAI_API_KEY: "replace-with-your-openai-key"
  # Required for LangSmith traces; keep blank only when tracing is disabled.
  LANGSMITH_API_KEY: "replace-with-your-langsmith-key"

