# Workflow name shown in GitHub Actions.
name: Docker Image

# Define when Docker image publishing should happen.
on:
  # Build/push image whenever main receives a commit.
  push:
    branches: ["main"]
    # Also support release tags such as v1.0.0.
    tags: ["v*.*.*"]

# Grant the workflow permission to publish images and write the dev GitOps tag.
permissions:
  # Write is required for the final manifest-only deployment commit.
  contents: write
  # Needed to push images to GitHub Container Registry.
  packages: write

# Jobs are independent units of workflow work.
jobs:
  # Gate image publication on the same automated tests used by CI.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

  # Build and push the Docker image.
  build:
    # Do not publish an image when tests fail.
    needs: test
    # Use GitHub's latest Ubuntu runner image.
    runs-on: ubuntu-latest
    # Steps run sequentially.
    steps:
      # Download repository source code into the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # Compute Docker image name, tags, and app version.
      - name: Set image metadata
        id: meta
        run: |
          # Read repository owner from GitHub context.
          OWNER="${{ github.repository_owner }}"
          # Docker/GHCR repository names must be lowercase.
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          # Final image path in GitHub Container Registry.
          IMAGE="ghcr.io/${OWNER_LC}/rentout-rag-chatbot"
          # Use first 12 characters of commit SHA as a traceable image tag.
          SHA_TAG="${GITHUB_SHA::12}"
          # Release tags get app version equal to the git tag name.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            APP_VERSION="${GITHUB_REF_NAME}"
          # Normal branch pushes get app version equal to the short commit SHA.
          else
            APP_VERSION="$SHA_TAG"
          fi
          # Expose image path to later workflow steps.
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          # Expose SHA tag to later workflow steps.
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          # Expose app version to Docker build args.
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      # Authenticate Docker CLI with GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          # Registry hostname for GitHub packages.
          registry: ghcr.io
          # GitHub actor is the account that triggered the workflow.
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically provided by GitHub Actions.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image and apply traceable tags.
      - name: Build image
        run: |
          # This command passes APP_VERSION, creates an immutable SHA tag, creates latest, and uses . as the build context.
          docker build --build-arg APP_VERSION="${{ steps.meta.outputs.app_version }}" -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" -t "${{ steps.meta.outputs.image }}:latest" .

      # If this run came from a release tag, create an extra semantic version tag.
      - name: Tag release image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Copy the SHA-tagged image to the release tag name.
          docker tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" "${{ steps.meta.outputs.image }}:${GITHUB_REF_NAME}"

      # Push all relevant tags to GHCR.
      - name: Push image tags
        run: |
          # Push immutable SHA tag.
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}"
          # Push latest tag.
          docker push "${{ steps.meta.outputs.image }}:latest"
          # Push release tag only for tag-triggered workflow runs.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            docker push "${{ steps.meta.outputs.image }}:${GITHUB_REF_NAME}"
          fi

      # Update only dev after a normal main-branch image build.
      # Test and prod advance through the separate manual promotion workflow.
      - name: Update development image tag
        if: github.ref == 'refs/heads/main'
        run: |
          # Replace the immutable tag in the dev Kustomize overlay.
          sed -i -E "s/^([[:space:]]*newTag:[[:space:]]*)[0-9a-f]{12}$/\1${{ steps.meta.outputs.sha_tag }}/" k8s/overlays/dev/kustomization.yaml
          # Identify the automation account in Git history.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only the desired-state file changed by this step.
          git add k8s/overlays/dev/kustomization.yaml
          # Avoid an empty commit when the overlay already contains this tag.
          if git diff --cached --quiet; then
            echo "Development already references ${{ steps.meta.outputs.sha_tag }}"
            exit 0
          fi
          # [skip ci] prevents a deployment-only commit from rebuilding the same image.
          git commit -m "deploy(dev): ${{ steps.meta.outputs.sha_tag }} [skip ci]"
          # Argo CD observes this Git change and automatically syncs rentout-dev.
          git push origin HEAD:main
