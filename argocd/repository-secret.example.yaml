# TEMPLATE ONLY: public repositories do not need this Secret.
# Use it only if the GitHub repository becomes private, and never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: rentout-private-repository
  namespace: argocd
  labels:
    # This label tells Argo CD that the Secret describes a Git repository.
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  # Human-readable repository connection name shown in Argo CD.
  name: rentout-rag-repository
  # HTTPS is simplest for a local learning cluster.
  type: git
  url: https://github.com/Shubhankitsirvaiya/Production-Ready-AI-API-Delivery-Pipeline-Rentout-RAG-API.git
  # GitHub account name used with a fine-grained token.
  username: replace-with-github-username
  # Use a fine-grained read-only token, not the GitHub account password.
  password: replace-with-read-only-github-token

